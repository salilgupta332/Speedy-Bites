{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Menu - Speedy Bites</title>
    <link rel="stylesheet" href="{% static 'css/menu.css' %}" />
  </head>
  <body>
    <main class="menu-section">
      <h1>Our Menu</h1>
      <div class="menu-items">
        {% for item in menu_items %}
        <div class="menu-card">
          {% if item.image_data and item.image_type %}
            <img src="data:{{ item.image_type }};base64,{{ item.image_data }}" alt="{{ item.name }}" />
          {% else %}
            <!-- If no image, you can use a placeholder or leave blank -->
            <!-- <img src="{% static 'images/placeholder.jpg' %}" alt="No image" /> -->
          {% endif %}
          <h3>{{ item.name }}</h3>
          <p>{{ item.description }}</p>
          <strong>₹{{ item.price }}</strong>
        </div>
        {% empty %}
        <p>No menu items available right now.</p>
        {% endfor %}
      </div>
    </main>
  </body>
</html>
